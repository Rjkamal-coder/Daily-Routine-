<div class="page-intro"><div><div class="eyebrow">MONEY AWARENESS</div><h1>Expenses</h1><p class="muted">Keep track of where your money goes.</p></div><div class="date-pill" id="expense-month-total">Monthly total: —</div></div><div class="panel"><h3 id="expense-form-title">Add an expense</h3><form id="expense-form" class="form-grid"><input type="hidden" id="expense-id"><label>Amount<input id="expense-amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></label><label>Category<select id="expense-category"><option>Food</option><option>Transportation</option><option>Education</option><option>Shopping</option><option>Mobile and Internet</option><option>Family</option><option>Health</option><option>Other</option></select></label><label>Date<input id="expense-date" type="date" required></label><label>Description<input id="expense-description" maxlength="180" placeholder="What was it for?"></label><div class="form-actions"><button class="btn primary">Save expense</button><button type="button" id="expense-cancel" class="btn subtle hidden">Cancel edit</button></div></form></div><div class="stats-grid compact" id="expense-stats"></div><div class="panel"><div class="panel-head"><h3>Expense history</h3><div class="inline-tools"><input id="expense-search" placeholder="Search expenses…"><button id="expense-export" class="btn subtle">↓ CSV</button></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Actions</th></tr></thead><tbody id="expense-rows"></tbody></table></div></div>
