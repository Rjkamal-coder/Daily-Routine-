<div class="page-intro"><div><div class="eyebrow">PLAN · EXECUTE · REVIEW</div><h1>Trading journal</h1><p class="muted">Record the actual outcome of every trade.</p></div><label>Month <input type="month" id="trade-month"></label></div><div id="trade-stats" class="stats-grid compact"></div><div class="panel"><h3 id="trade-form-title">Add trade record</h3><form id="trade-form" class="form-grid"><input type="hidden" id="trade-id"><label>Date<input type="date" id="trade-date" required></label><label>Instrument<input id="trade-instrument" list="instruments" placeholder="EURUSD" required><datalist id="instruments"><option>XAUUSD</option><option>EURUSD</option><option>GBPUSD</option><option>BTCUSD</option><option>US30</option></datalist></label><label>Session<select id="trade-session"><option>Asia</option><option>London</option><option>New York</option><option>Other</option></select></label><label>Strategy<input id="trade-strategy" placeholder="e.g. Break and retest"></label><label>Entry price<input type="number" step="any" id="trade-entry"></label><label>Stop loss<input type="number" step="any" id="trade-sl"></label><label>Take profit<input type="number" step="any" id="trade-tp"></label><label>Risk %<input type="number" min="0" step="0.01" id="trade-risk"></label><label>Planned risk amount<input type="number" min="0" step="0.01" id="trade-planned-risk"></label><label>Result<select id="trade-result"><option value="breakeven">Breakeven</option><option value="win">Win</option><option value="loss">Loss</option></select></label><label>Winning amount<input type="number" min="0" step="0.01" id="trade-win" value="0"></label><label>Losing amount<input type="number" min="0" step="0.01" id="trade-loss" value="0"></label><label class="wide">Notes<textarea id="trade-notes" rows="2" placeholder="What went well? What can improve?"></textarea></label><div class="form-actions"><button class="btn primary">Save trade</button><button type="button" id="trade-cancel" class="btn subtle hidden">
